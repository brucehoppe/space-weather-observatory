name: Windows release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    name: Build x64 installer (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - name: Build, test and package
        shell: pwsh
        run: pwsh -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release-candidate
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/space-weather-observatory.exe
