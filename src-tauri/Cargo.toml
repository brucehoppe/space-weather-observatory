[package]
name = "space-weather-observatory"
default-run = "space-weather-observatory"
description = "Space Weather Observatory desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Tauri v2 builds the app as a library so mobile targets and tests can share it.
name = "swo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
swo-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4.1"
tauri-plugin-opener = "2.5.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "json", "http2", "charset"] }
tokio = { version = "1.48.0", features = ["sync", "time", "macros", "rt-multi-thread"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
sha2 = "0.10.9"
dirs = "6.0.0"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3.24.0"
